# Atualiza o dashboard todo dia às 12h (Brasília) nos servidores do GitHub, com o PC desligado.
# Enviado pelo publicar.py para .github/workflows/atualizar.yml no repositório.
# Precisa do segredo ID_SHEETS (Settings > Secrets and variables > Actions).
name: Atualizar dashboard

on:
  # O agendador do GitHub atrasa (às vezes horas) em horário cheio: 4 tentativas fora da hora cheia,
  # basta uma sair no horário. Horários em UTC = Brasília + 3h (11:53, 12:23, 12:53 e 13:23).
  schedule:
    - cron: "53 14 * * *"
    - cron: "23 15 * * *"
    - cron: "53 15 * * *"
    - cron: "23 16 * * *"
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar bibliotecas
        run: pip install pandas==2.2.3 openpyxl==3.1.5
      - name: Gerar dashboard
        env:
          ID_SHEETS: ${{ secrets.ID_SHEETS }}
        run: |
          test -n "$ID_SHEETS" || { echo "Falta o segredo ID_SHEETS"; exit 1; }
          cd codigo
          python gerar_dashboard.py
          cp "Dashboard Shopee Inventário.html" ../index.html
      - name: Publicar
        run: |
          git config user.name "atualizador-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "Sem mudanças"; exit 0; }
          git commit -m "Atualiza dashboard ($(date '+%d/%m/%Y %H:%M'))"
          git push
          # Garante que o GitHub Pages publique a versão nova
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
